name: CI/CD React (Docker + GHCR + SSH Deploy)

on:
  push:
    tags:
      - '*'      # 모든 태그(push → v1.2.3 등)에 반응

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) 프로젝트 파일 유무 확인 (npm 사용 기준)
      - name: Verify build context files
        run: |
          echo "🔎 Checking files in workspace:"
          ls -la .
          if [ ! -f package-lock.json ]; then echo "🚨 package-lock.json not found!"; exit 1; fi
          if [ ! -f package.json ]; then echo "🚨 package.json not found!"; exit 1; fi
          echo "✅ package.json and package-lock.json are present."

      # 3) QEMU & Buildx 세팅 (멀티아키 지원)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4) GHCR 로그인
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: jihoonleee
          password: ${{ secrets.GHCR_TOKEN }}

      # 5) 도커 이미지 빌드 & 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          build-args: |
            REACT_APP_API_URL=https://api.bokko.kr
          context: .
          file:    ./Dockerfile
          push:    true
          tags: |
            ghcr.io/jihoonleee/my-dog:latest
            ghcr.io/jihoonleee/my-dog:${{ github.ref_name }}

      # 6) SSH 준비
      - name: Prepare SSH directory
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

      - name: Populate known_hosts
        run: |
          echo "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Add SSH key to agent
        run: |
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519

      - name: Test SSH connection
        run: ssh -o StrictHostKeyChecking=no deploy@bokko.kr "echo SSH 연결 성공"

      # 7) 서버에 배포
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     bokko.kr
          port:     22
          username: deploy
          key:      ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e

            # 7.1) .env.release.gpg 복호화
            echo "Decrypting environment…"
            GPG_PASSPHRASE="${{ secrets.GPG_PASSPHRASE }}"
            gpg --quiet --batch --yes \
                --passphrase "$GPG_PASSPHRASE" \
                --output ~/borikkori/secret/view/.env.release \
                --decrypt ~/borikkori/secret/view/.env.release.gpg

            # 7.2) GHCR 로그인
            echo "🔐 GHCR 로그인"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u jihoonleee --password-stdin

            IMAGE=ghcr.io/jihoonleee/my-dog:${{ github.ref_name }}
            echo "⬇️ Pulling new image: $IMAGE"
            docker pull $IMAGE

            # 컨테이너 교체 (Nginx 프록시용 3000 포트)
            docker rm -f react-app || true
            docker run -d \
              --name react-app \
              --restart unless-stopped \
              -p 3000:80 \
              --env-file ~/borikkori/secret/view/.env.release \
              $IMAGE